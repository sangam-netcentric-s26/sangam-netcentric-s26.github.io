<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Friends Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        input[type="number"] {
            padding: 0.5rem;
            width: 120px;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1rem;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 0.6rem;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .message {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Friends</h1>

        <div id="message" class="message"></div>

        <div class="table-responsive">
            <table id="friendsTable" class="table table-striped table-hover table-bordered shadow">
                <thead class="table-dark">
                    <tr>
                        <th>Full Name</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <script>
            const API_URL = "https://friends-node-01-47e26a48b0b0.herokuapp.com/friends";

            const tableBody = document.querySelector("#friendsTable tbody");
            const messageDiv = document.getElementById("message");

            function clearTable() {
                tableBody.innerHTML = "";
            }

            function showMessage(message) {
                messageDiv.textContent = message;
            }

            function addFriendRow(friend) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td><a href="${API_URL}/${friend.id}" target="_blank" class="text-decoration-none fw-semibold">
                    ${friend.firstName} ${friend.lastName} </a>
                    </td>
                `;
                tableBody.appendChild(row);
            }

            async function loadAllFriends() {
                clearTable();
                showMessage("Loading all friends...");

                try {
                    const response = await fetch(API_URL);

                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }

                    const friends = await response.json();

                    if (!Array.isArray(friends) || friends.length === 0) {
                        showMessage("No friends found.");
                        return;
                    }

                    friends.forEach(addFriendRow);
                    showMessage(`Loaded ${friends.length} friend(s).`)
                } catch (error) {
                    showMessage(`Error loading friends: ${error.message}`);
                }
            }
            
            loadAllFriends();
        </script>
</body>

</html>
