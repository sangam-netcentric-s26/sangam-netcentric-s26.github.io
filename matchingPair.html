<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matching Pair Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            width: 100px;
            height: 100px;
            perspective: 1000px;
            cursor: pointer;
            border: none;
            background: none;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            border-radius: 10px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }

        .card-front {
            background-color: #0d6efd;
            color: white;
        }

        .card-back {
            background-color: white;
            border: 2px solid #0d6efd;
            color: #212529;
            transform: rotateY(180deg);
        }

        #message {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 20px;
        }

        #stats {
            text-align: center;
            margin-top: 15px;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Matching Pair Game</h1>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="gameForm" class="p-4 bg-white rounded shadow">
                    <div class="mb-3">
                        <label for="trials" class="form-label">How many tries?</label>
                        <input type="number" class="form-control" id="trials" name="trials" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="pairs" class="form-label">How many pairs?</label>
                        <input type="number" class="form-control" id="pairs" name="pairs" min="2" max="8" required>
                        <div class="form-text">Choose between 2 and 8 pairs.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Start Game</button>
                </form>
            </div>
        </div>

        <div id="stats"></div>
        <div id="message"></div>
        <div id="gameBoard" class="game-board"></div>
    </div>

    <script>
        let gameData = {
            maxTries: 0,
            remainingTries: 0,
            totalPairs: 0,
            matchedPairs: 0,
            firstCard: null,
            secondCard: null,
            lockBoard: false,
            cards: []
        };

        const gameForm = document.getElementById("gameForm");
        const gameBoard = document.getElementById("gameBoard");
        const message = document.getElementById("message");
        const stats = document.getElementById("stats");

        gameForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const tries = parseInt(document.getElementById("trials").value);
            const pairs = parseInt(document.getElementById("pairs").value);

            if (isNaN(tries) || isNaN(pairs) || tries < 1 || pairs < 2 || pairs > 8) {
                alert("Please enter valid values. Tries must be at least 1, and pairs must be between 2 and 8.");
                return;
            }

            startGame(tries, pairs);
        });

        function startGame(tries, pairs) {
            gameData.maxTries = tries;
            gameData.remainingTries = tries;
            gameData.totalPairs = pairs;
            gameData.matchedPairs = 0;
            gameData.firstCard = null;
            gameData.secondCard = null;
            gameData.lockBoard = false;
            gameData.cards = [];

            message.textContent = "Game started! Click any two cards.";
            gameBoard.innerHTML = "";

            createCards(pairs);
            renderBoard();
            updateStats();
        }

        function createCards(pairs) {
            let numbers = [];

            for (let i = 1; i <= pairs; i++) {
                numbers.push(i);
                numbers.push(i);
            }

            // Shuffle cards randomly
            numbers.sort(() => Math.random() - 0.5);

            gameData.cards = numbers.map((num, index) => {
                return {
                    id: index,
                    value: num,
                    flipped: false,
                    matched: false
                };
            });
        }

        function renderBoard() {
            gameBoard.innerHTML = "";

            if (gameData.cards.length <= 4) {
                gameBoard.style.gridTemplateColumns = "repeat(2, 100px)";
            } else if (gameData.cards.length <= 8) {
                gameBoard.style.gridTemplateColumns = "repeat(4, 100px)";
            } else if (gameData.cards.length <= 12) {
                gameBoard.style.gridTemplateColumns = "repeat(4, 100px)";
            } else {
                gameBoard.style.gridTemplateColumns = "repeat(4, 100px)";
            }

            gameData.cards.forEach(cardData => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.dataset.id = cardData.id;

                if (cardData.flipped || cardData.matched) {
                    card.classList.add("flipped");
                }

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${cardData.value}</div>
                    </div>
                `;

                card.addEventListener("click", () => handleCardClick(cardData.id));
                gameBoard.appendChild(card);
            });
        }

        function handleCardClick(cardId) {
            if (gameData.lockBoard) return;

            const clickedCard = gameData.cards.find(card => card.id === cardId);

            if (!clickedCard || clickedCard.flipped || clickedCard.matched) return;

            clickedCard.flipped = true;
            renderBoard();

            if (!gameData.firstCard) {
                gameData.firstCard = clickedCard;
                return;
            }

            gameData.secondCard = clickedCard;
            gameData.lockBoard = true;

            checkForMatch();
        }

        function checkForMatch() {
            const first = gameData.firstCard;
            const second = gameData.secondCard;

            if (first.value === second.value) {
                first.matched = true;
                second.matched = true;
                gameData.matchedPairs++;

                console.log("It is a match!");
                message.textContent = "It is a match!";

                resetTurn();

                if (gameData.matchedPairs === gameData.totalPairs) {
                    message.textContent = "Yipee, all pairs are matched!";
                    console.log("Yipee, all pairs are matched!");
                }
            } else {
                gameData.remainingTries--;
                console.log("Try again.");
                message.textContent = "Not a match. Try again.";

                updateStats();

                setTimeout(() => {
                    first.flipped = false;
                    second.flipped = false;
                    resetTurn();

                    if (gameData.remainingTries <= 0) {
                        message.textContent = "Game over! You ran out of tries.";
                        gameData.lockBoard = true;

                        // Optional: reveal all cards when game ends
                        gameData.cards.forEach(card => card.flipped = true);
                        renderBoard();
                    } else {
                        renderBoard();
                    }
                }, 1000);

                return;
            }

            renderBoard();
            updateStats();
        }

        function resetTurn() {
            gameData.firstCard = null;
            gameData.secondCard = null;
            gameData.lockBoard = false;
        }

        function updateStats() {
            stats.textContent = `Remaining Tries: ${gameData.remainingTries} | Matched Pairs: ${gameData.matchedPairs}/${gameData.totalPairs}`;
        }
    </script>
</body>
</html>
